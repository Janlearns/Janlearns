name: Generate snake animation

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake svgs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Colours follow the profile palette in scripts/build_profile.py.
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#3B5BFF&color_dots=#161B22,#5C4A0F,#9C7C12,#E0B21E,#FFD43B
            dist/snake-light.svg?color_snake=#3B5BFF&color_dots=#EBEDF0,#FFF1B8,#FFE173,#FFD43B,#111111


      - name: push snake svgs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
