<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518" />
      <stop offset="50%" stop-color="#12092b" />
      <stop offset="100%" stop-color="#05020c" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9745f5" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9745f5" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Glowing Node Animation -->
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.15); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes scanline {
        0% { transform: translateY(0); }
        100% { transform: translateY(280px); }
      }
      .node { animation: pulse 3s infinite ease-in-out; }
      .node-delayed { animation: pulse 3.5s infinite ease-in-out 1.5s; }
      .floating { animation: float 5s infinite ease-in-out; }
      .data-stream { stroke-dasharray: 8 12; animation: dash 2s linear infinite; }
      .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; }
      .sub-text { font-family: 'Fira Code', 'Courier New', monospace; font-weight: 500; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="1000" height="280" rx="16" fill="url(#bg-grad)" stroke="#2e1065" stroke-width="1.5"/>

  <!-- Cyber Grid Background -->
  <g opacity="0.07" stroke="#c084fc" stroke-width="1">
    <path d="M0 40 H1000 M0 80 H1000 M0 120 H1000 M0 160 H1000 M0 200 H1000 M0 240 H1000" />
    <path d="M100 0 V280 M200 0 V280 M300 0 V280 M400 0 V280 M500 0 V280 M600 0 V280 M700 0 V280 M800 0 V280 M900 0 V280" />
  </g>

  <!-- Neural Network Vector Graphics (Right Side) -->
  <g class="floating">
    <!-- Synapse Connections -->
    <path d="M720 70 L820 50 M720 70 L800 130 M720 70 L830 200" stroke="#9745f5" stroke-width="1.5" opacity="0.4"/>
    <path d="M820 50 L930 90 M800 130 L930 90 M800 130 L920 180 M830 200 L920 180 M830 200 L930 230" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Data Stream Lines -->
    <path class="data-stream" d="M720 70 L800 130 L930 90" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.8"/>
    <path class="data-stream" d="M720 150 L830 200 L920 180" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8"/>

    <!-- Nodes -->
    <!-- Input Layer -->
    <circle cx="720" cy="70" r="7" fill="#9745f5" class="node" filter="url(#glow)"/>
    <circle cx="720" cy="140" r="6" fill="#818cf8" class="node-delayed" filter="url(#glow)"/>
    <circle cx="720" cy="210" r="7" fill="#9745f5" class="node" filter="url(#glow)"/>

    <!-- Hidden Layer -->
    <circle cx="820" cy="50" r="8" fill="#38bdf8" class="node-delayed" filter="url(#glow)"/>
    <circle cx="800" cy="130" r="9" fill="#c084fc" class="node" filter="url(#glow)"/>
    <circle cx="830" cy="200" r="8" fill="#38bdf8" class="node-delayed" filter="url(#glow)"/>

    <!-- Output Layer -->
    <circle cx="930" cy="90" r="10" fill="#f43f5e" class="node" filter="url(#glow)"/>
    <circle cx="920" cy="180" r="9" fill="#c084fc" class="node-delayed" filter="url(#glow)"/>
    <circle cx="930" cy="230" r="7" fill="#38bdf8" class="node" filter="url(#glow)"/>

    <!-- Node Labels / Rings -->
    <circle cx="800" cy="130" r="15" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.5" class="node"/>
    <circle cx="930" cy="90" r="18" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.5" class="node-delayed"/>
  </g>

  <!-- Left Accent AI Geometric Deco -->
  <g opacity="0.6">
    <circle cx="60" cy="70" r="30" fill="none" stroke="#9745f5" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="60" cy="70" r="45" fill="none" stroke="#38bdf8" stroke-width="0.75" opacity="0.4"/>
    <circle cx="60" cy="70" r="5" fill="#38bdf8" filter="url(#soft-glow)"/>
  </g>

  <!-- Main Content Text -->
  <g transform="translate(120, 0)">
    <!-- Badge Pill -->
    <rect x="0" y="48" width="220" height="28" rx="14" fill="#2e1065" fill-opacity="0.6" stroke="#9745f5" stroke-width="1"/>
    <circle cx="15" cy="62" r="4" fill="#10b981" filter="url(#soft-glow)"/>
    <text x="28" y="66" fill="#a7f3d0" font-size="12" class="sub-text" letter-spacing="1">AVAILABLE FOR AI ROLES</text>

    <!-- Main Title -->
    <text x="0" y="125" fill="url(#text-grad)" font-size="38" class="title-text" filter="url(#soft-glow)" letter-spacing="0.5">
      RAYZAN FAZRI R.
    </text>

    <!-- Subtitle / Role -->
    <text x="0" y="162" fill="#e2e8f0" font-size="20" class="sub-text" letter-spacing="2">
      Machine Learning &amp; AI Engineer
    </text>

    <!-- Skill Tags Line -->
    <g transform="translate(0, 185)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="135" height="24" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="67" y="16" fill="#c7d2fe" font-size="11" class="sub-text" text-anchor="middle">🧠 Deep Learning</text>

      <!-- Tag 2 -->
      <rect x="145" y="0" width="135" height="24" rx="6" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
      <text x="212" y="16" fill="#bae6fd" font-size="11" class="sub-text" text-anchor="middle">👁️ Computer Vision</text>

      <!-- Tag 3 -->
      <rect x="290" y="0" width="115" height="24" rx="6" fill="#311042" stroke="#a855f7" stroke-width="1"/>
      <text x="347" y="16" fill="#f0abfc" font-size="11" class="sub-text" text-anchor="middle">⚡ NLP &amp; LLMs</text>
    </g>

    <!-- Dynamic Glowing Bottom Line -->
    <path d="M0 230 L450 230" stroke="url(#line-grad)" stroke-width="2" filter="url(#glow)"/>
  </g>
</svg>
