<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 260" width="100%" height="260">
  <defs>
    <linearGradient id="matrix-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d081e" />
      <stop offset="50%" stop-color="#140b2e" />
      <stop offset="100%" stop-color="#080412" />
    </linearGradient>

    <linearGradient id="bar-py" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3776AB" />
      <stop offset="100%" stop-color="#FFD43B" />
    </linearGradient>

    <linearGradient id="bar-torch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EE4C2C" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>

    <linearGradient id="bar-tf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6F00" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>

    <linearGradient id="bar-sklearn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7931E" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>

    <linearGradient id="bar-cv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5C3EE8" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <filter id="glow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .tech-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: bold; }
      .mono-sm { font-family: 'Fira Code', monospace; font-size: 11px; }
      .bar-bg { fill: #1e153b; rx: 4px; }
      .skill-card { fill: #120926; stroke: #2a164f; stroke-width: 1.2; rx: 10px; transition: all 0.3s; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="950" height="260" rx="14" fill="url(#matrix-bg)" stroke="#2e145c" stroke-width="1.5"/>

  <!-- Title -->
  <text x="30" y="32" fill="#c084fc" font-size="14" class="mono-sm" font-weight="bold" letter-spacing="1.5">
    🛠️ CORE TECHNICAL COMPETENCIES & PROFICIENCY METRICS
  </text>

  <!-- Left Column: Core ML & AI Skills -->
  <g transform="translate(30, 50)">
    <!-- Skill 1: Python -->
    <text x="0" y="20" fill="#e2e8f0" class="tech-title" font-size="13">Python (Data Science &amp; AI Core)</text>
    <text x="400" y="20" fill="#ffd43b" class="mono-sm" text-anchor="end">95%</text>
    <rect x="0" y="28" width="400" height="8" class="bar-bg"/>
    <rect x="0" y="28" width="380" height="8" fill="url(#bar-py)" rx="4" filter="url(#glow-card)"/>

    <!-- Skill 2: PyTorch & Deep Learning -->
    <text x="0" y="60" fill="#e2e8f0" class="tech-title" font-size="13">PyTorch &amp; Neural Architectures</text>
    <text x="400" y="60" fill="#ff7a00" class="mono-sm" text-anchor="end">90%</text>
    <rect x="0" y="68" width="400" height="8" class="bar-bg"/>
    <rect x="0" y="68" width="360" height="8" fill="url(#bar-torch)" rx="4" filter="url(#glow-card)"/>

    <!-- Skill 3: TensorFlow & Keras -->
    <text x="0" y="100" fill="#e2e8f0" class="tech-title" font-size="13">TensorFlow &amp; Keras</text>
    <text x="400" y="100" fill="#ffa800" class="mono-sm" text-anchor="end">88%</text>
    <rect x="0" y="108" width="400" height="8" class="bar-bg"/>
    <rect x="0" y="108" width="352" height="8" fill="url(#bar-tf)" rx="4" filter="url(#glow-card)"/>

    <!-- Skill 4: Scikit-Learn & Classical ML -->
    <text x="0" y="140" fill="#e2e8f0" class="tech-title" font-size="13">Scikit-Learn &amp; ML Algorithms</text>
    <text x="400" y="140" fill="#ffd166" class="mono-sm" text-anchor="end">92%</text>
    <rect x="0" y="148" width="400" height="8" class="bar-bg"/>
    <rect x="0" y="148" width="368" height="8" fill="url(#bar-sklearn)" rx="4" filter="url(#glow-card)"/>

    <!-- Skill 5: Computer Vision & Data Viz -->
    <text x="0" y="180" fill="#e2e8f0" class="tech-title" font-size="13">Computer Vision &amp; Image Processing</text>
    <text x="400" y="180" fill="#00f2fe" class="mono-sm" text-anchor="end">85%</text>
    <rect x="0" y="188" width="400" height="8" class="bar-bg"/>
    <rect x="0" y="188" width="340" height="8" fill="url(#bar-cv)" rx="4" filter="url(#glow-card)"/>
  </g>

  <!-- Right Column: Framework Grid Cards -->
  <g transform="translate(480, 50)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="135" height="55" class="skill-card"/>
    <text x="15" y="24" fill="#3b82f6" class="tech-title" font-size="18">📈</text>
    <text x="42" y="24" fill="#f8fafc" class="tech-title" font-size="12">Pandas</text>
    <text x="42" y="40" fill="#94a3b8" class="mono-sm">Data Analysis</text>

    <!-- Card 2 -->
    <rect x="150" y="0" width="135" height="55" class="skill-card"/>
    <text x="165" y="24" fill="#3b82f6" class="tech-title" font-size="18">🔢</text>
    <text x="192" y="24" fill="#f8fafc" class="tech-title" font-size="12">NumPy</text>
    <text x="192" y="40" fill="#94a3b8" class="mono-sm">Matrix Ops</text>

    <!-- Card 3 -->
    <rect x="300" y="0" width="135" height="55" class="skill-card"/>
    <text x="315" y="24" fill="#3b82f6" class="tech-title" font-size="18">📊</text>
    <text x="342" y="24" fill="#f8fafc" class="tech-title" font-size="12">Matplotlib</text>
    <text x="342" y="40" fill="#94a3b8" class="mono-sm">Visualization</text>

    <!-- Card 4 -->
    <rect x="0" y="70" width="135" height="55" class="skill-card"/>
    <text x="15" y="94" fill="#3b82f6" class="tech-title" font-size="18">🪐</text>
    <text x="42" y="94" fill="#f8fafc" class="tech-title" font-size="12">Jupyter</text>
    <text x="42" y="110" fill="#94a3b8" class="mono-sm">Notebooks</text>

    <!-- Card 5 -->
    <rect x="150" y="70" width="135" height="55" class="skill-card"/>
    <text x="165" y="94" fill="#3b82f6" class="tech-title" font-size="18">☁️</text>
    <text x="192" y="94" fill="#f8fafc" class="tech-title" font-size="12">Colab</text>
    <text x="192" y="110" fill="#94a3b8" class="mono-sm">GPU Compute</text>

    <!-- Card 6 -->
    <rect x="300" y="70" width="135" height="55" class="skill-card"/>
    <text x="315" y="94" fill="#3b82f6" class="tech-title" font-size="18">🌿</text>
    <text x="342" y="94" fill="#f8fafc" class="tech-title" font-size="12">Git &amp; GitHub</text>
    <text x="342" y="110" fill="#94a3b8" class="mono-sm">Version Control</text>

    <!-- Card 7 -->
    <rect x="0" y="140" width="135" height="55" class="skill-card"/>
    <text x="15" y="164" fill="#3b82f6" class="tech-title" font-size="18">🤖</text>
    <text x="42" y="164" fill="#f8fafc" class="tech-title" font-size="12">OpenCV</text>
    <text x="42" y="180" fill="#94a3b8" class="mono-sm">Vision Algo</text>

    <!-- Card 8 -->
    <rect x="150" y="140" width="135" height="55" class="skill-card"/>
    <text x="165" y="164" fill="#3b82f6" class="tech-title" font-size="18">⚙️</text>
    <text x="192" y="164" fill="#f8fafc" class="tech-title" font-size="12">REST APIs</text>
    <text x="192" y="180" fill="#94a3b8" class="mono-sm">Model Serving</text>

    <!-- Card 9 -->
    <rect x="300" y="140" width="135" height="55" class="skill-card"/>
    <text x="315" y="164" fill="#3b82f6" class="tech-title" font-size="18">💻</text>
    <text x="342" y="164" fill="#f8fafc" class="tech-title" font-size="12">VS Code</text>
    <text x="342" y="180" fill="#94a3b8" class="mono-sm">Primary IDE</text>
  </g>
</svg>
