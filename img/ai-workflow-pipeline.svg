<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 200" width="100%" height="200">
  <defs>
    <linearGradient id="pipe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0717" />
      <stop offset="100%" stop-color="#05030a" />
    </linearGradient>

    <linearGradient id="node-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="node-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <linearGradient id="node-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <linearGradient id="node-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="glow-pipe" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes flow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      .connector { stroke-dasharray: 6 6; animation: flow 1.5s linear infinite; }
      .p-text { font-family: 'Segoe UI', system-ui, sans-serif; }
      .mono-text { font-family: 'Fira Code', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="950" height="200" rx="14" fill="url(#pipe-bg)" stroke="#27104e" stroke-width="1.5"/>

  <!-- Section Title -->
  <text x="30" y="32" fill="#c084fc" font-size="14" class="mono-text" font-weight="bold" letter-spacing="1.5">
    ⚡ END-TO-END MACHINE LEARNING PIPELINE ARCHITECTURE
  </text>

  <!-- Connecting Lines -->
  <path class="connector" d="M190 115 L260 115" stroke="#3b82f6" stroke-width="2.5" />
  <path class="connector" d="M430 115 L500 115" stroke="#8b5cf6" stroke-width="2.5" />
  <path class="connector" d="M670 115 L740 115" stroke="#ec4899" stroke-width="2.5" />

  <!-- STEP 1: DATA PIPELINE -->
  <g transform="translate(30, 55)">
    <rect width="160" height="115" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="80" cy="35" r="20" fill="url(#node-grad-1)" filter="url(#glow-pipe)" />
    <text x="80" y="40" fill="#ffffff" font-size="16" text-anchor="middle" class="p-text">📊</text>
    <text x="80" y="75" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" class="p-text">Data Ingestion</text>
    <text x="80" y="94" fill="#94a3b8" font-size="10" text-anchor="middle" class="mono-text">Pandas • NumPy • SQL</text>
  </g>

  <!-- STEP 2: MODELING -->
  <g transform="translate(270, 55)">
    <rect width="160" height="115" rx="12" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5" />
    <circle cx="80" cy="35" r="20" fill="url(#node-grad-2)" filter="url(#glow-pipe)" />
    <text x="80" y="40" fill="#ffffff" font-size="16" text-anchor="middle" class="p-text">🧠</text>
    <text x="80" y="75" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" class="p-text">Deep Learning</text>
    <text x="80" y="94" fill="#cbd5e1" font-size="10" text-anchor="middle" class="mono-text">PyTorch • TensorFlow</text>
  </g>

  <!-- STEP 3: OPTIMIZATION -->
  <g transform="translate(510, 55)">
    <rect width="160" height="115" rx="12" fill="#31102f" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="80" cy="35" r="20" fill="url(#node-grad-3)" filter="url(#glow-pipe)" />
    <text x="80" y="40" fill="#ffffff" font-size="16" text-anchor="middle" class="p-text">🎯</text>
    <text x="80" y="75" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" class="p-text">Optimization</text>
    <text x="80" y="94" fill="#fbcfe8" font-size="10" text-anchor="middle" class="mono-text">Hyperparameter • Metrics</text>
  </g>

  <!-- STEP 4: DEPLOYMENT -->
  <g transform="translate(750, 55)">
    <rect width="160" height="115" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="80" cy="35" r="20" fill="url(#node-grad-4)" filter="url(#glow-pipe)" />
    <text x="80" y="40" fill="#ffffff" font-size="16" text-anchor="middle" class="p-text">🚀</text>
    <text x="80" y="75" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" class="p-text">Deployment</text>
    <text x="80" y="94" fill="#a7f3d0" font-size="10" text-anchor="middle" class="mono-text">REST API • Production</text>
  </g>
</svg>
